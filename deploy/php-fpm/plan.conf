; Отдельный пул php-fpm для plan.his.kz (как у supply).
;
; Установка:
;   sudo cp deploy/php-fpm/plan.conf /etc/php/8.3/fpm/pool.d/
;   sudo php-fpm8.3 -t && sudo systemctl reload php8.3-fpm

[plan]

user = ubuntu
group = ubuntu

listen = /run/php/php8.3-fpm-plan.sock
listen.owner = ubuntu
listen.group = ubuntu
listen.mode = 0660

; ondemand: в покое пул почти не занимает память, пользователей – единицы.
; Загрузки до 64M – сканы и PDF чертежей этажей.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
php_admin_value[error_log] = /var/log/plan/php-error.log
php_admin_flag[log_errors] = on

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 70M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

php_admin_value[date.timezone] = Asia/Almaty
