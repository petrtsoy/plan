# Виртуальный хост plan.his.kz. Повторяет supply.his.kz.conf.
#
# Установка:
#   sudo cp deploy/apache/plan.his.kz.conf /etc/apache2/sites-available/
#   sudo a2ensite plan.his.kz && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName plan.his.kz
    DocumentRoot /var/www/plan/public

    # Проверку Let's Encrypt пропускаем мимо редиректа, иначе сертификат не продлится.
    RedirectMatch temp ^/(?!\.well-known/acme-challenge/).*$ https://plan.his.kz/

    <Directory /var/www/plan/public/.well-known>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName plan.his.kz
    DocumentRoot /var/www/plan/public

    SSLEngine on

    <Directory /var/www/plan/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Свой пул php-fpm: соседние hr, supply и it не делят с нами воркеров.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm-plan.sock|fcgi://localhost"
    </FilesMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/plan.his.kz-error.log
    CustomLog ${APACHE_LOG_DIR}/plan.his.kz-access.log combined

    SSLCertificateFile    /etc/letsencrypt/live/plan.his.kz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/plan.his.kz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
